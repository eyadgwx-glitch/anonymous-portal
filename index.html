
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Anonymous Portal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 28px;
  text-align: center;
}

h2 { letter-spacing: 2px; }

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 12px;
}

.accept {
  background: white;
  color: black;
}

.reject {
  background: #292929;
  color: white;
}

#details { display: none; }

input {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  border-radius: 7px;
  border: 1px solid #444;
  background: #1c1c1c;
  color: white;
}

.notice {
  color: #aaa;
  font-size: 13px;
  line-height: 1.8;
}

#status {
  color: #aaa;
  font-size: 13px;
  line-height: 1.8;
}
</style>
</head>

<body>
<div class="container">

  <div id="choice">
    <h2>ANONYMOUS PORTAL</h2>
    <button class="accept" onclick="accept()">موافق</button>
    <button class="reject" onclick="reject()">رفض</button>
  </div>

  <div id="details">
    <h3>مشاركة الملفات</h3>

    <p class="notice">
      اكتب اسمك واختر الملفات التي تريد مشاركتها.
      لن يتم إرسال أي ملف دون موافقتك.
    </p>

    <input id="name" type="text" placeholder="اكتب اسمك">

    <input
      id="files"
      type="file"
      multiple
      accept="image/*,video/*,.pdf,.doc,.docx"
    >

    <button class="accept" onclick="confirmShare()">
      تأكيد الاختيار
    </button>

    <p id="status"></p>
  </div>

</div>

<script>
function accept() {
  document.getElementById("choice").style.display = "none";
  document.getElementById("details").style.display = "block";
}

function reject() {
  document.getElementById("choice").style.display = "none";
}

function confirmShare() {
  const name = document.getElementById("name").value.trim();
  const files = document.getElementById("files").files;
  const status = document.getElementById("status");

  if (!name || files.length === 0) {
    status.textContent = "اكتب اسمك واختر الملفات أولاً.";
    return;
  }

  status.textContent =
    "تم اختيار " + files.length +
    " ملف. هذه نسخة تجريبية ولا يتم رفع الملفات.";
}
</script>

</body>
</html>
