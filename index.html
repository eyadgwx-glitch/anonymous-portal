
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Portal</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.container {
  width: 90%;
  max-width: 400px;
  padding: 30px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 15px;
}

.buttons {
  display: flex;
  gap: 12px;
}

button {
  flex: 1;
  padding: 15px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.accept {
  background: #eee;
  color: #080808;
}

.reject {
  background: #292929;
  color: white;
}

#filesArea {
  display: none;
  margin-top: 25px;
}

input {
  color: white;
  max-width: 100%;
}

#status {
  color: #aaa;
  text-align: center;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">

  <div class="buttons" id="choice">
    <button class="accept" onclick="acceptConsent()">موافق</button>
    <button class="reject" onclick="rejectConsent()">رفض</button>
  </div>

  <div id="filesArea">
    <input type="file" id="files" multiple accept="image/*,video/*,.pdf,.doc,.docx">
    <p id="status"></p>
  </div>

</div>

<script>
function acceptConsent() {
  document.getElementById("choice").style.display = "none";
  document.getElementById("filesArea").style.display = "block";
}

function rejectConsent() {
  document.getElementById("choice").style.display = "none";
  document.getElementById("filesArea").style.display = "none";
}

document.getElementById("files").addEventListener("change", function() {
  document.getElementById("status").textContent =
    "تم اختيار " + this.files.length + " ملف. لم يتم إرسالها.";
});
</script>

</body>
</html>
